<h2>Login</h2>
<form method="post">
  {% csrf_token %}
  {% if next %}
    <input type="hidden" name="next" value="{{ next }}">
  {% endif %}
  {{ form.as_p }}
  <button type="submit">Login</button>
</form>
<p>Need an account? <a href="{% url 'register' %}">Register here</a>.</p>
<p><a href="{% url 'password_reset' %}">Forgot Password?</a></p>
