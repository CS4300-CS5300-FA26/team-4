version: 2
updates:
  # Maintain dependencies for Python/pip
  - package-ecosystem: "pip"
    # Target the root directory containing requirements.txt
    directory: "/"
    # Configure the scanning schedule
    schedule:
      interval: "weekly" 
      day: "monday"
    # Optional: Automatically label Pull Requests created by Dependabot
    labels:
      - "dependencies"
      - "security"